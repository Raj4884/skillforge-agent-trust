[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skillforge-agent-trust"
dynamic = ["version"]
description = "Evidence-based static inspection for AI agent skills"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "SkillForge contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
build = ["build>=1,<2"]

[project.urls]
Homepage = "https://github.com/Raj4884/skillforge-agent-trust"
Issues = "https://github.com/Raj4884/skillforge-agent-trust/issues"
Changelog = "https://github.com/Raj4884/skillforge-agent-trust/blob/main/CHANGELOG.md"

[project.scripts]
skillforge = "skillforge.cli:main"

[tool.setuptools.dynamic]
version = {attr = "skillforge.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
# Corpus cases are inert sample skills used as test data, not project code.
extend-exclude = ["tests/corpus"]
